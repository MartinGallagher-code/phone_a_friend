name: Publish to PyPI

# Publishes when a version tag (v*) is pushed, a GitHub release is
# created, or the workflow is dispatched manually.
# Uses PyPI "trusted publishing" - no API token needed. One-time setup:
# on pypi.org -> your project (or pending publisher) -> Publishing ->
# add GitHub publisher: owner MartinGallagher-code, repo phone_a_friend,
# workflow publish.yml, environment pypi.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  pyz:
    # Attach the single-file build to each GitHub release.
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to upload the release asset
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build paf.pyz and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          python tools/build_pyz.py paf.pyz
          gh release upload "$TAG" paf.pyz --clobber
