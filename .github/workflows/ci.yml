name: CI

# publish.yml calls this workflow (workflow_call) and uploads nothing until
# every job here passes on the commit being published; it then uploads the
# dist and paf.pyz artifacts that the build and pyz jobs below made.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    # ubuntu-latest is Ubuntu 26.04, for which setup-python has no 3.9
    # build ("The version '3.9' with architecture 'x64' was not found"), so
    # 3.9 runs on the last image that has it rather than dropping out.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        # PyYAML is for tests/test_release.py, which reads the workflows.
        run: pip install . 'coverage[toml]' pyyaml
      - name: Run tests with coverage (100% enforced)
        run: |
          coverage run -m unittest discover -s tests -v
          coverage report
      - name: Smoke-test the CLI
        run: |
          D="$(mktemp -d)"
          paf -d "$D" -u alice --passphrase pw-a register
          paf -d "$D" -u bob   --passphrase pw-b register
          paf -d "$D" -u alice --passphrase pw-a invite bob
          paf -d "$D" -u bob   --passphrase pw-b accept --from alice
          paf -d "$D" -u alice --passphrase pw-a send --to bob "hello"
          paf -d "$D" -u bob   --passphrase pw-b read --to alice | grep -q "hello"
          ! grep -r "hello" "$D" --include="*.json" -l | grep -q . || exit 1

  fips:
    # The suite on Rocky Linux 9's own python3-cryptography, bound to the
    # system OpenSSL 3 and its FIPS provider. OPENSSL_FORCE_FIPS_MODE is
    # RHEL's switch for putting that OpenSSL in FIPS mode without booting
    # the host with fips=1: the same provider and the same refusals (X25519
    # and ChaCha20 fail), which the suite checks it is really under.
    name: fips (Rocky Linux 9)
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:9
    steps:
      - uses: actions/checkout@v4
      - name: Install the distribution's cryptography (no pip)
        run: dnf -y -q install python3-cryptography
      - name: Run the suite with OpenSSL in FIPS mode
        env:
          OPENSSL_FORCE_FIPS_MODE: "1"
        run: |
          python3 -c "from phone_a_friend import crypto; assert crypto.fips_enabled(), crypto.fips_status(); print(crypto.fips_status())"
          python3 -m unittest discover -s tests -v
      - name: Smoke-test paf in FIPS mode
        env:
          OPENSSL_FORCE_FIPS_MODE: "1"
        run: |
          D="$(mktemp -d)"
          paf() { python3 -m phone_a_friend "$@"; }
          paf -d "$D" -u alice --passphrase pw-a register 2> err.txt
          ! grep -q "FIPS" err.txt
          paf -d "$D" -u bob   --passphrase pw-b register
          paf -d "$D" -u alice --passphrase pw-a invite bob
          paf -d "$D" -u bob   --passphrase pw-b accept --from alice
          paf -d "$D" -u alice --passphrase pw-a send --to bob "hello"
          paf -d "$D" -u bob   --passphrase pw-b read --to alice | grep -q "hello"
          ! grep -r "hello" "$D" --include="*.json" -l | grep -q . || exit 1

  pyz:
    name: paf.pyz (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the single file
        run: python tools/build_pyz.py paf.pyz
      - name: It holds no compiled code
        run: |
          python -m zipfile -l paf.pyz
          ! python -m zipfile -l paf.pyz | grep -E '\.(so|pyd)\b'
      - uses: actions/upload-artifact@v4
        with:
          name: paf.pyz
          path: paf.pyz
          retention-days: 7

  pyz-rocky:
    # The single file on a clean Rocky Linux 9: python3 and the distribution's
    # python3-cryptography from dnf, no pip, run by a user without root.
    name: paf.pyz (Rocky Linux 9, no pip, no root)
    needs: pyz
    runs-on: ubuntu-latest
    container: quay.io/rockylinux/rockylinux:9
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: paf.pyz
      - name: Install python3-cryptography, and nothing else
        run: |
          dnf -y -q install python3-cryptography
          ! python3 -m pip --version
          useradd -m chat
          install -m 0644 paf.pyz /home/chat/paf.pyz
      - name: Two users talk through paf.pyz, in and out of FIPS mode
        run: |
          for mode in off on; do
            E=""; if [ "$mode" = on ]; then E="OPENSSL_FORCE_FIPS_MODE=1"; fi
            su chat -c "
              set -e
              export PAF_FIPS_WARNING=0 $E
              cd ~ && D=\$(mktemp -d) && P='python3 paf.pyz -d '\$D
              python3 paf.pyz --help > /dev/null
              python3 paf.pyz --version | tail -1
              \$P -u alice --passphrase pw-a register
              \$P -u bob   --passphrase pw-b register
              \$P -u alice --passphrase pw-a invite bob
              \$P -u bob   --passphrase pw-b accept --from alice
              \$P -u alice --passphrase pw-a send --to bob hello
              \$P -u bob   --passphrase pw-b read --to alice | grep -q hello
            "
          done
      - name: Without python3-cryptography it names the package and exits 1
        run: |
          rpm -e --nodeps python3-cryptography
          set +e
          su chat -c "cd ~ && python3 paf.pyz --version" > out.txt 2> err.txt
          code=$?
          set -e
          cat err.txt
          test "$code" = 1
          test ! -s out.txt
          test "$(wc -l < err.txt)" = 1
          grep -q python3-cryptography err.txt

  version:
    name: version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Every place the version is written agrees
        run: bash tests/check_version.sh
      - name: The version moved past the base branch's
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          bash tests/check_version.sh FETCH_HEAD
      - name: The version moved past main's before this push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          case "$BEFORE" in ''|0000000000000000000000000000000000000000) exit 0 ;; esac
          git fetch --depth=1 origin "$BEFORE"
          bash tests/check_version.sh FETCH_HEAD

  reuse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: REUSE compliance check
        uses: fsfe/reuse-action@v5

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install build twine
          python -m build
          twine check dist/*
      - name: The sdist installs, holds everything, and its own suite passes
        # Unpacks the sdist, checks it carries every file of the checkout's
        # package, tests, tools and licences, that it loads as many tests as
        # the checkout, and runs the suite from inside it.
        run: |
          pip install dist/*.tar.gz
          python tools/check_release.py sdist dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
